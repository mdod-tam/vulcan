version: "3.0"
last_updated: "2026-09-18"
application: "MAT Vulcan"

# Manual source catalog; no controls-YAML CI linter or schema validation is configured.
# Framework mappings are retained from the older catalog and need current-policy review.
# Implementation describes source, not deployment verification or an audit attestation.
priority_levels:
  critical: { label: "Critical", value: 1 }
  high: { label: "High", value: 2 }
  medium: { label: "Medium", value: 3 }
  low: { label: "Low", value: 4 }

controls:
  authentication:
    - id: "AUTH-001"
      name: "User Authentication"
      frameworks: { doit: ["IA-2", "PR.AC-1"], nist_csf: ["PR.AC-1", "PR.AC-7"], nist_800_53: ["IA-5", "AC-7"], rails: ["ActiveModel::SecurePassword"] }
      priority: { label: "Critical", value: 1 }
      owner: "@david"
      implementation:
        summary: "Passwords are hashed with BCrypt (has_secure_password). Accounts lock after five failed attempts."
        files: ["app/models/concerns/user_authentication.rb", "app/controllers/sessions_controller.rb"]
      verification_needed: "Verify the stated BCrypt cost target of at least 12, and review the password-hashing policy."
      audit: { report: null, coverage: null, next_review_due: null }

    - id: "AUTH-002"
      name: "Multi-Factor Authentication"
      frameworks: { doit: ["IA-2", "G21-1"], nist_csf: ["PR.AC-7"], nist_800_53: ["IA-2"] }
      priority: { label: "Critical", value: 1 }
      owner: "@david"
      implementation:
        summary: "WebAuthn (security keys), TOTP (authenticator-app codes), and SMS codes. Required for administrators, evaluators, trainers, and vendors. Optional for constituents."
        files: ["app/controllers/application_controller.rb", "app/controllers/two_factor_authentications_controller.rb"]
      verification_needed: "Confirm role coverage against applicable authentication requirements."
      audit: { report: null, coverage: null, next_review_due: null }

    - id: "AUTH-003"
      name: "Password Policy"
      frameworks: { doit: ["PR.AC-1"] }
      priority: { label: "High", value: 2 }
      owner: "@david"
      implementation:
        summary: "Minimum password length is 12 characters (UserAuthentication::PASSWORD_MIN_LENGTH), matching the cited external-user guidance. Every new-password field states it."
        files: ["app/models/concerns/user_authentication.rb"]
      verification_needed: "Confirm the guidance's sensitivity-based authentication requirements beyond length. See baseline_policy.md."

    - id: "AUTH-004"
      name: "Session Management"
      frameworks: { doit: ["PR.AC-1"], nist_800_53: ["AC-12"] }
      priority: { label: "High", value: 2 }
      owner: "@david"
      implementation:
        summary: "Signed session token in an HttpOnly cookie, marked Secure in production. The default absolute expiry is 24 hours."
        files: ["app/models/session.rb", "app/controllers/concerns/authentication.rb", "app/controllers/application_controller.rb"]
      verification_needed: "The stated 30-minute idle target and session-fixation reset are not established by absolute expiry."

  data_protection:
    - id: "DATA-001"
      name: "Data Encryption"
      frameworks: { doit: ["SC-13", "PR.DS-2"], nist_csf: ["PR.DS-1", "PR.DS-2"], rails: ["ActiveRecord::Encryption"] }
      priority: { label: "Critical", value: 1 }
      owner: "@david"
      implementation:
        summary: "Selected database fields are encrypted. See pii_encryption.md for fields, lookup rules, and key constraints."
        files: ["app/models/concerns/user_profile.rb", "config/initializers/active_record_encryption.rb"]
      verification_needed: "Stable deployed keys, storage/backup encryption, TLS settings, and annual key-rotation evidence."
      audit: { report: null, coverage: null, next_review_due: null }

    - id: "DATA-002"
      name: "Input Validation & Filtering"
      frameworks: { doit: ["SC-13", "IA-7"] }
      priority: { label: "High", value: 2 }
      owner: "@david"
      implementation:
        summary: "Sensitive parameters are filtered out of logs. Controller parameters and model validations remain specific to each workflow."
        files: ["config/initializers/filter_parameter_logging.rb", "app/models/concerns/user_profile.rb"]
      verification_needed: "Check new fields, named SQL binds (query values sent with their column names), and error logs for personal data or bearer links."

    - id: "DATA-003"
      name: "CSRF Protection"
      frameworks: { doit: ["PR.IP-9"], rails: ["RequestForgeryProtection"] }
      priority: { label: "High", value: 2 }
      owner: "@david"
      implementation:
        summary: "The base controller has cross-site request forgery (CSRF) protection on. A forged request is rejected with an error (protect_from_forgery with exception handling)."
        files: ["app/controllers/application_controller.rb"]
      verification_needed: "Review exemptions and the authentication contract of each public endpoint."

  access_control:
    - id: "AUTHZ-002"
      name: "Authorization Checks"
      frameworks: { doit: ["PR.AC-4"] }
      priority: { label: "Critical", value: 1 }
      owner: "@david"
      implementation:
        summary: "Authentication helpers supply role checks. Portal controllers own record-access scope."
        files: ["app/controllers/concerns/authentication.rb"]
      verification_needed: "Exercise unauthorized roles and cross-owner record access at the affected endpoint."

    - id: "AUTHZ-003"
      name: "API Security"
      frameworks: { doit: ["PR.AC-4"], rails: ["RateLimit", "AuthRateLimit"] }
      priority: { label: "High", value: 2 }
      owner: "@david"
      implementation:
        summary: "Policy-backed request throttles, held in cache, for proofs and secure forms. Public sign-in, password-reset, and account-recovery limits are keyed by identifier digest."
        files: ["app/services/rate_limit.rb", "app/services/auth_rate_limit.rb"]
      verification_needed: "Review token audience, expiry, replay, and throttle behavior for each exposed path."

  http_security:
    - id: "CONFIG-001"
      name: "Application Hardening & Secure Configuration"
      frameworks: { doit: ["SC-13", "IA-7"] }
      priority: { label: "Critical", value: 1 }
      owner: "@david"
      implementation:
        summary: "Production forces HTTPS (force_ssl) and hides local exception details. The CSP initializer is commented out."
        files: ["config/environments/production.rb", "config/initializers/content_security_policy.rb"]
      verification_needed: "Confirm deployed TLS, the Strict-Transport-Security header (HSTS), other headers, CSP, secret custody, and 90-day secret rotation."

  audit_and_logging:
    - id: "AUDIT-001"
      name: "Security Logging"
      frameworks: { doit: ["DE.AE-1/2"] }
      priority: { label: "High", value: 2 }
      implementation:
        summary: "Production sends tagged application logs to standard output (stdout)."
        files: ["config/environments/production.rb"]
      verification_needed: "Central collection, 400-day retention target, access controls, and authentication/privilege alerts."

    - id: "AUDIT-002"
      name: "Audit Trail"
      frameworks: { doit: ["AU-3"] }
      priority: { label: "Medium", value: 3 }
      implementation:
        summary: "Domain workflows record audit Event rows through AuditEventService. Coverage depends on the workflow."
        files: ["app/services/audit_event_service.rb", "app/models/event.rb"]
      verification_needed: "Confirm actor, subject, event coverage, and retention without sensitive metadata."

  testing_and_vulnerability_management:
    - id: "TEST-001"
      name: "Security Testing & Assessment"
      frameworks: { doit: ["CA-2.1", "RA-5", "SI-2"] }
      priority: { label: "Critical", value: 1 }
      implementation:
        summary: "The continuous-integration (CI) pipeline runs Brakeman, a static security scanner for Rails."
        files: [".github/workflows/ci.yml", ".github/workflows/main.yml"]
      verification_needed: "Dated annual independent penetration test, quarterly vulnerability scans, and remediation evidence."

    - id: "SCA-001"
      name: "Supply-Chain Security (SBOM & SCA)"
      frameworks: { doit: ["SI-2", "RA-5"] }
      priority: { label: "High", value: 2 }
      implementation:
        summary: "Dependabot checks Bundler and GitHub Actions daily."
        files: [".github/dependabot.yml"]
      verification_needed: "Required CI dependency scanning and software bill of materials (SBOM) generation are not present in the checked-in workflows."

    - id: "PATCH-001"
      name: "Patch Management (Ruby/Rails)"
      frameworks: { doit: ["RA-5"] }
      priority: { label: "High", value: 2 }
      implementation:
        summary: "Dependabot provides dependency update proposals. Deployment timing needs operational records."
        files: [".github/dependabot.yml"]
      verification_needed: "Weekly alert triage and Ruby/Rails security updates and critical fixes within 30 days, or stricter applicable deadlines."

  error_handling:
    - id: "ERROR-001"
      name: "Error Management & Exception Handling"
      frameworks: { doit: ["PR.DS-6"] }
      priority: { label: "High", value: 2 }
      implementation:
        summary: "Production disables local exception detail pages and provides a public error page."
        files: ["config/environments/production.rb", "public/500.html"]
      verification_needed: "Confirm deployed error reporting and redaction. No monitoring provider is certified here."

  file_security:
    - id: "FILE-SEC-001"
      name: "Active Storage Validation"
      frameworks: { doit: ["SC-13", "IA-7"], rails: ["ActiveStorage::Validations"] }
      priority: { label: "High", value: 2 }
      implementation:
        summary: "Proof uploads are checked for allowed content types and size."
        files: ["app/models/concerns/proof_manageable.rb"]
      verification_needed: "Check each upload path, download authorization, and malware scanning. Validation alone does not scan files."

metadata:
  review_frequency: "Quarterly"
  responsible_team: "Security Team"
  last_audit_date: null
  evidence_note: "Empty (null) audit values mean unverified. Add real reports, measured coverage, and assigned review dates after assessment."
  policy: "docs/security/baseline_policy.md"
