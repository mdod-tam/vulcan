name: Rails CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, develop]

env:
  RAILS_ENV: test
  DATABASE_USERNAME: postgres
  DATABASE_PASSWORD: postgres
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mat_vulcan_test
  NODE_VERSION: '24'
  POSTGRES_DB: mat_vulcan_test
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres

jobs:
  security_scan:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
          
      - name: Run Brakeman security scan
        # Runs through bundle exec instead of bin/brakeman.
        run: bundle exec brakeman --no-pager

  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
          
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Cache Yarn dependencies
        uses: actions/setup-node@v4
        with:
          cache: 'yarn'

      - name: Install image processing library
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libvips42t64
          
      - name: Install JS dependencies
        run: yarn install --immutable

      - name: Run JavaScript tests
        run: yarn test --ci --runInBand
        
      - name: Build assets
        run: |
          mkdir -p app/assets/builds
          yarn run build
          yarn run build:css
        
      - name: Database setup
        run: bin/rails db:setup
        
      - name: Run Rails tests
        run: bin/rails test

      - name: Run browser lifecycle tests
        env:
          SYSTEM_TEST_WORKERS: '1'
          CHROME_NO_SANDBOX: 'true'
          RAILS_SYSTEM_TESTING_SCREENSHOT_HTML: '1'
        run: bin/rails test test/system/lifecycles

      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-diagnostics
          path: tmp/capybara/
          if-no-files-found: ignore

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: log/test*.log
          if-no-files-found: ignore
