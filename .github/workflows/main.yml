name: Rails Test
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        ports:
          - "5432:5432"
        env:
          POSTGRES_DB: rails_test
          POSTGRES_USER: rails
          POSTGRES_PASSWORD: password
        # Jobs start only after Postgres passes this health check.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RAILS_ENV: test
        
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Ruby and gems
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable Corepack
        run: corepack enable

      - name: Cache Yarn dependencies
        uses: actions/setup-node@v4
        with:
          cache: 'yarn'

      - name: Install image processing library
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libvips42t64

      - name: Install JS dependencies
        run: yarn install --immutable
      # Solid Queue reads the queue database from database.yml, so CI writes a file that points both databases at the Postgres service.
      - name: Overwrite database.yml for CI
        run: |
          cat <<EOF > config/database.yml
          test:
            primary:
              adapter: postgresql
              encoding: unicode
              host: 127.0.0.1
              username: rails
              password: password
              database: rails_test
              pool: 5
            queue:
              adapter: postgresql
              encoding: unicode
              host: 127.0.0.1
              username: rails
              password: password
              database: rails_test
              pool: 5
              migrations_paths: db/queue_migrate
          EOF

      - name: Set up database
        run: bin/rails db:setup

      - name: Precompile assets
        run: bin/rails assets:precompile

      - name: Run rails test
        run: bin/rails test

      - name: run Brakeman
        run: bundle exec brakeman -q
        
