default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
      concurrency_maintenance_interval: 300
  workers:
    - queues: [default, mailers, low, low_priority]
      threads: 1
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 1
    - queues: document_scans
      threads: 1
      processes: 1
      polling_interval: 1

development:
  <<: *default
  workers:
    - queues: [default, mailers, low, low_priority]
      threads: 2
      processes: 1
      polling_interval: 1
    - queues: document_scans
      threads: 1
      processes: 1
      polling_interval: 1

test:
  <<: *default

production:
  <<: *default
